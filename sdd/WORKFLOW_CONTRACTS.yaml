# sdd/WORKFLOW_CONTRACTS.yaml — contrato de máquina das peças que passam de uma fase a outra.
# Formato: só `chave: "texto"`, mapas aninhados por 2 espaços e listas `- "texto"` (lido pela stdlib, sem
# biblioteca de YAML). tests/test_f12_textos.py confere que todo caminho entre crases existe e que os campos,
# seções e blocos daqui batem com os briefs, o lint e o passo 11 do sdd-define.

version: "1"

verify_gate:
  runner: "`sdd/bin/verify-gate.sh`"
  fragment: "`sdd/templates/fragments/VERIFY_GATE.md`"
  produced_by: "`.agents/skills/sdd-define/SKILL.md` passo 8: todo DEFINE sai com um bloco ## Verify Gate executável"
  consumed_by:
    - "`.agents/skills/sdd-build/SKILL.md`: gate autoritativo e bloqueante; exit 2 aborta o build"
    - "`.agents/skills/sdd-release/SKILL.md`: gate bloqueante da publicação"
  exits:
    ok: "0"
    vermelho: "2"
    inconclusivo: "3"
    assinatura_humana: "4"
    clarificar: "5"
    spec_invalida: "64"
  clarificar_motivos:
    - "marcador ativo de ambiguidade (colchete + NEEDS CLARIFICATION + dois-pontos) fora de cerca"
    - "linha Governança ausente ou sem valor final no ## Technical Context"
  governanca_valores_finais:
    - "N.A. — <motivo>"
    - "GOVERNANCA_REVIEW_<F>.md · a aplicadas · r recusadas · d adiadas"
    - "dispensada — <motivo>"

cartografo:
  brief: "`.agents/skills/sdd-define/references/cartografo.md`"
  script: "`sdd/bin/contexto-lint.sh`"
  fronteira: "`sdd/bin/governanca-fronteira.sh`"
  activation: "passo 1.5 do sdd-define: contexto-lint.sh --sugerir decide gerar | reusar | pular"
  campos:
    - "ctx"
    - "saida"
    - "worktree"
    - "dominio"
  campo_redespacho: "lint"
  snapshot: "<pasta temporária>/sdd-fronteira-<hash da raiz>/<F>/cartografo-<slug>/"
  permitido: "sdd/contexto/<slug>.md"
  secoes:
    - "Escopo"
    - "Dados"
    - "Operações"
    - "Interfaces"
    - "Regras vigentes"
    - "Landmines"
    - "Histórico SDD"
  retorno: "<<<CONTEXTO"
  redespachos: "1"
  falha: "o Define segue com CONTEXTO de domínio: nenhum (<motivo>)"
  max_dominios: "2"

revisor_governanca:
  brief: "`.agents/skills/sdd-governanca/references/revisor.md`"
  skill: "`.agents/skills/sdd-governanca/SKILL.md`"
  fronteira: "`sdd/bin/governanca-fronteira.sh`"
  activation: "passo 11 do sdd-define, sempre, inclusive com --parar; o marcador é gravado antes do despacho"
  campos:
    - "define"
    - "skill"
    - "padrao"
    - "worktree"
    - "saida"
  snapshot: "<pasta temporária>/sdd-fronteira-<hash da raiz>/<F>/governanca/"
  permitido: "sdd/reviews/GOVERNANCA_REVIEW_<F>.md"
  retorno: "<<<GOVERNANCA"
  validador: "`sdd/bin/governanca-bloco.py`"
  resultados:
    - "NA"
    - "REVISADO"
    - "PADRAO_AUSENTE"
    - "FALHA"
  redespachos: "1"
  falha: "o marcador fica no DEFINE e o verify-gate.sh sai 5"
  prova_script: "gravado em sdd/tests/governanca/ e ligado ao cmd do Verify Gate pelo passo 11 do sdd-define; o Design só lista"

curador:
  brief: "`.agents/skills/sdd-playbook/references/curator.md`"
  script: "`sdd/bin/playbook-curator.sh`"
  fronteira: "`sdd/bin/governanca-fronteira.sh`"
  activation: "passo 17b da sdd-release, depois do push, quando a colheita sai 0 ou traz PROMOVER?"
  campos:
    - "feature"
    - "staging"
    - "colheita"
    - "playbook"
    - "worktree"
  staging: "<pasta temporária>/sdd-curadoria-<hash da raiz>/<F>/"
  snapshot: "<pasta temporária>/sdd-fronteira-<hash da raiz>/<F>/curador/"
  permitido: "sdd/reports/briefs/BRIEF_curador_<F>.md"
  retorno: "<<<CURADORIA"
  validador: "`sdd/bin/playbook-curator.sh` --conferir-bloco"
  colunas:
    - "#"
    - "Tipo"
    - "LM"
    - "Delta"
    - "Evidência"
    - "Em linguagem simples"
    - "Recomendação"
  tipos:
    - "contador"
    - "sugestao"
    - "add"
    - "refine"
    - "tombstone"
    - "promover"
    - "inv"
  recomendacoes:
    - "AUTO"
    - "ACEITAR"
    - "DESCARTAR"
    - "NAO_JULGADO"
    - "PERGUNTA OBRIGATÓRIA"
  finais:
    - "REJEITADOS:"
    - "NAO_JULGADO:"
    - "IGNORADOS/JA_COLHIDOS:"
    - "CONTAMINAÇÃO:"
  campo_redespacho: "conferencia"
  selo: "playbook-curator.sh --selar <staging>, gravado na pasta do snapshot antes do despacho"
  auto: "só contador com AUTO igual a uma linha DELTA da colheita (ID, verbo, +1 e arquivo:linha); sugestao vai para pergunta"
  cabecalho_licao:
    - "fonte"
    - "lm-nnn"
    - "id"
  cabecalho_veredito:
    - "veredito"
    - "tratamento"
  registro: "sdd/releases/<F>/CURATOR-colhidos.txt (linhas com fp= já julgadas; não contam de novo)"
  redespachos: "1"
  falha: "a ficha registra Curadoria: FALHOU e nada é aplicado; a publicação não é afetada"
  invariantes: "`sdd/invariants.md`"

sdd_drive:
  script: "`sdd/bin/sdd-drive.sh`"
  skill: "`.agents/skills/sdd-drive/SKILL.md`"
  brief: "`.agents/skills/sdd-drive/references/executor.md`"
  campos:
    - "define"
    - "design"
    - "progress"
    - "tarefa"
    - "worktree"
  retorno: "<<<RODADA"
  exits:
    concluido: "0"
    continuar: "10"
    parada: "20"
    aguardando_humano: "40"
    falha: "2"
    uso: "64"
  acoes:
    - "ESPERAR"
    - "DESIGN"
    - "REVISAO_DESIGN"
    - "RODADA"
    - "CORRIGIR"
    - "COMMITAR"
    - "VERIFICAR"
    - "AVALIAR_E_RELATAR"
  motivos:
    - "gate-verde"
    - "simulacao"
    - "orcamento-rodadas"
    - "manual-ux"
    - "clarificacao-pendente"
    - "define-invalido"
    - "gate-inconclusivo"
    - "gate-alterado"
    - "bloqueio-humano"
    - "aguardando-sessao"
    - "estado-invalido"
    - "branch-padrao"
  barreira: "nenhum verbo publica; publicar é a sdd-release, com o OK da pessoa"

slot:
  script: "`sdd/bin/slot.sh`"
  chaves:
    - "smoke.before_ok_cmd"
    - "smoke.before_push_cmd"
    - "smoke.after_deploy_cmd"
    - "schema.check_cmd"
  consumed_by:
    - "`.agents/skills/sdd-release/SKILL.md`: itens 6b, 7b e 10 (os 3 smokes)"
    - "`.agents/skills/sdd-build/references/aplicar-migration.md`: seção 2b, antes da prévia (schema.check_cmd)"
  variaveis:
    - "SDD_MOMENTO"
    - "SDD_FEATURE"
    - "SDD_BASE"
    - "SDD_COMMIT"
    - "SDD_ARVORE"
    - "SDD_SLOT_DIR"
  exits:
    ok: "0"
    reprovou: "2"
    inconclusivo: "3"
    nada_a_medir: "10"
    pulado: "11"
    uso: "64"
  argumentos: "os arquivos vão no fim do comando, um por argumento"

raio_de_impacto:
  brief: "`.agents/skills/sdd-release/references/raio-de-impacto.md`"
  activation: "passo 0b da sdd-release: um agente fresco por superfície; sem subagente, em sequência na mesma sessão"
  campos:
    - "superficie"
    - "antes"
    - "depois"
    - "invariantes"
    - "worktree"
  retorno: "<<<RAIO"
