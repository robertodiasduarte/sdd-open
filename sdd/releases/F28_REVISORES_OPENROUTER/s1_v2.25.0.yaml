descricao: "Skill nova sdd-configurar-revisores (1.0.0): mede o estado da revisão adversarial deste computador (slots, git config, a chave do OpenRouter no ambiente e no perfil, as CLIs) com um script que só lê, traduz cada um dos 26 estados numa frase e num passo, conduz o aluno pelo OpenRouter (conta, crédito, chave com limite de gasto, a chave gravada no perfil sem aparecer na tela nem na conversa) ou pelas CLIs que ele já tem, grava a escolha no git config deste computador e termina com uma prova que não gasta (a consulta de leitura da chave e da lista pública de modelos, e o plano da revisão). O adversarial-review.sh lê sdd.revisor1/sdd.auditor do git config quando o slot está vazio e o --dry-run mostra a origem, a disponibilidade, o 2º revisor e o desempate, também sem diff; a sdd-checar-ambiente 1.7.0 avisa quando os revisores faltam; sdd-design 2.11.0, sdd-build 2.14.0 e sdd-release 2.19.0 oferecem a skill; guia do aluno, adversarial-review.md e README (24 skills)"
