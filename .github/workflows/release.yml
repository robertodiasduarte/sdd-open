name: release

# A change to the framework that reaches main publishes the next Release on its own: tag vX.Y.Z
# (latest + 1 patch), the package sdd-open-vX.Y.Z.tar.gz and SHA256SUMS.txt. A vX.Y.Z tag pushed
# by hand (a minor or major with a written message) becomes a Release too.
#
# ⛔ A tag created with the GITHUB_TOKEN does not trigger another workflow ("events triggered by
# the GITHUB_TOKEN will not create a new workflow run"). The tag and the Release are therefore born
# in the SAME job (`gh release create --target` creates the tag): a design of "push the tag and let
# another workflow publish" would create the tag and never publish, with nothing in the log.
#
# Two jobs: `testes` holds a read-only token; `release` (needs: testes) is the only one with
# contents: write. A red test ⇒ `release` is skipped and no tag is created. Nothing here uses
# continue-on-error or `|| true`: a check that cannot fail is not a check.
#
# GitHub does not evaluate `paths` on tag pushes: a vX.Y.Z tag always runs, and publishes exactly
# the tag that was pushed (next-version.sh receives it). Tags like v2.3.0-rc1 do not trigger.
#
# Queue: one group per ref. GitHub keeps only ONE pending run per group and cancels the older
# pending one when a newer arrives; with a single group, a main push could cancel a pending tag
# run and that tag would never get a Release. Skipping an intermediate main run is harmless: the
# newer run publishes the newer content.
# The version logic lives in scripts/next-version.sh, covered by tests/test_next_version.py.

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'bin/**'
      - 'sdd/bin/**'
      - 'sdd/hooks/**'
      - 'sdd/templates/**'
      - 'sdd/fixtures/**'
      - 'sdd/playbook.md'
      - 'sdd/config.example.yaml'
      - 'AGENTS.md.tmpl'
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes (só leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # a shallow checkout has no tags, and the version and the base come from them

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run publish gate
        env:
          PUBLISH_GATE_MODE: ci
        run: bash scripts/publish-gate.sh "$GITHUB_WORKSPACE"

      # A published skill is code the agent obeys: a change that hides text (invisible, bidi, tag or
      # variation-selector Unicode) or fetches and runs remote code must not reach a Release.
      # Fail-closed: any hit, an unreadable file, or a target with nothing to read fails the step.
      # Left out on purpose: U+200D and U+FE0F, which build emoji (the skills use them). Known gaps
      # of a line heuristic: `| tee x | sh`, a pipe split by `\` across lines, PowerShell `iex`.
      - name: Skill integrity (invisible Unicode, remote code piped to a shell)
        run: |
          python3 -B - .agents/skills <<'PY'
          import pathlib, re, sys
          invisivel = re.compile("[\u00ad\u034f\u061c\u115f-\u1160\u180e\u200b\u200c\u200e\u200f\u2028-\u202e\u2060-\u2064\u2066-\u2069\u3164\ufe00-\ufe0e\ufeff\uffa0\ufff9-\ufffb\U000e0000-\U000e007f\U000e0100-\U000e01ef]")
          interprete = r"(sudo(\s+-\S+)*\s+)?(\S*/)?(env\s+)?((ba|z|da|k)?sh|python[0-9.]*|perl|ruby|node)\b"
          remoto = re.compile(r"(curl|wget)\b[^\n|]*\|\s*" + interprete
                              + r"|base64\s+(-d|-D|--decode)\b[^\n|]*\|\s*" + interprete
                              + r"|eval\s+[\"']?(\$\(|`)\s*(curl|wget)"
                              + r"|(ba|z|da|k)?sh\s+(-c\s+[\"']?\$\(|<\()\s*(curl|wget)"
                              + r"|(source|\.)\s+<\(\s*(curl|wget)")
          raiz = pathlib.Path(sys.argv[1])
          if not raiz.is_dir():
              sys.exit(f"FAIL {raiz}: not a directory — nothing was scanned")
          achados = lidos = 0
          for p in sorted(raiz.rglob("*")):
              if not p.is_file():
                  continue
              try:
                  texto = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  print(f"FAIL {p}: not UTF-8 text")
                  achados += 1
                  continue
              lidos += 1
              for n, linha in enumerate(texto.split("\n"), 1):
                  if invisivel.search(linha):
                      print(f"FAIL {p}:{n}: invisible Unicode {[hex(ord(c)) for c in invisivel.findall(linha)]}")
                      achados += 1
                  if remoto.search(linha):
                      print(f"FAIL {p}:{n}: remote code run by a shell: {linha.strip()[:120]}")
                      achados += 1
          if not lidos:
              sys.exit(f"FAIL {raiz}: no text file read — nothing was scanned")
          print(f"skill integrity: {achados} finding(s) in {lidos} file(s) under {raiz}")
          sys.exit(1 if achados else 0)
          PY

      # Same step as publish-gate.yml: that workflow runs alongside this one, not before it, so a
      # red publish-gate would not stop a Release.
      - name: Shell syntax, no zsh, no symlinks
        run: |
          set -u +e
          fail=0
          for f in $(find . -name '*.sh' -not -path './.git/*'); do bash -n "$f" || { echo "bash -n failed: $f"; fail=1; }; done
          if grep -rl '^#!/bin/zsh' --include='*.sh' . ; then echo "zsh shebang found"; fail=1; fi
          if [ -n "$(find . -type l -not -path './.git/*')" ]; then echo "symlink found"; fail=1; fi
          exit $fail

      - name: Unit tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'

      # Fail-closed: a skill that changed without bumping metadata.version does not become a
      # Release, because the copy people install would claim a version its content no longer has.
      - name: Version gate (against the previous release)
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then set -- "$GITHUB_REF_NAME"; fi
          proxima="$(bash scripts/next-version.sh "$@")"
          printf '%s\n' "$proxima"
          base="$(printf '%s\n' "$proxima" | sed -n 's/^BASE=//p')"
          python3 scripts/check-versions.py --base "$base" --base-obrigatoria

  # The floor the package promises (Python 3.9 + bash 3.2) is what macOS ships in /usr/bin and /bin;
  # ubuntu-latest has neither, so without this job the floor was proved only on the author's machine.
  # `release` needs it too: a script that breaks on bash 3.2 does not become a Release.
  testes-macos:
    name: Testes no piso (macOS, só leitura)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install gitleaks (darwin)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Asserted, not printed: if the image stops shipping Python 3.9 or bash 3.2, the floor is no
      # longer proved and the job says so. Scripts that call `python3` from PATH (bin/sdd-open.sh,
      # bin/lib/merge.sh) get the floor too, not the newer Homebrew one.
      - name: Floor versions (asserted) and python3 of the floor first in PATH
        run: |
          /usr/bin/python3 -c 'import sys; print(sys.version); sys.exit(sys.version_info[:2] != (3, 9))'
          /bin/bash -c 'echo "bash $BASH_VERSION"; [ "${BASH_VERSINFO[0]}" = 3 ]'
          mkdir -p "$RUNNER_TEMP/piso"
          printf '#!/bin/sh\nexec /usr/bin/python3 "$@"\n' > "$RUNNER_TEMP/piso/python3"
          chmod +x "$RUNNER_TEMP/piso/python3"
          echo "$RUNNER_TEMP/piso" >> "$GITHUB_PATH"

      - name: python3 in PATH is the floor
        run: |
          command -v python3
          python3 -c 'import sys; print(sys.version); sys.exit(sys.version_info[:2] != (3, 9))'

      - name: Unit tests on the floor (/usr/bin/python3, SDD_TEST_BASH=/bin/bash)
        env:
          SDD_TEST_BASH: /bin/bash
        run: /usr/bin/python3 -B -m unittest discover -s tests -p 'test_*.py'

  release:
    name: Publicar release
    needs: [testes, testes-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only here: create the tag and the Release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Compute version
        id: v
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then set -- "$GITHUB_REF_NAME"; fi
          bash scripts/next-version.sh "$@" | tee -a "$GITHUB_OUTPUT"

      # Integrity and date stamp: the hash proves the package was not swapped, and the Release
      # date (which the author does not write) proves this content existed here on that day.
      # Whoever downloads checks it with: shasum -a 256 -c SHA256SUMS.txt
      - name: Build package and checksums
        env:
          TAG: ${{ steps.v.outputs.TAG }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="sdd-open-$TAG/" -o "dist/sdd-open-$TAG.tar.gz" "$GITHUB_SHA"
          cd dist && sha256sum "sdd-open-$TAG.tar.gz" > SHA256SUMS.txt && cat SHA256SUMS.txt

      # A tag push and a main push can carry the same commit; the second run finds the Release
      # already there and stops green instead of failing on a duplicate.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — nothing to publish"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "sdd-open $TAG" --generate-notes \
            "dist/sdd-open-$TAG.tar.gz" dist/SHA256SUMS.txt
